<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 قیمت لحظه‌ای طلا، سکه و دلار | رهیلاناب</title>
    <meta name="description" content="قیمت لحظه‌ای و خودکار طلا، سکه، دلار و ارز در بازار آزاد ایران. به‌روزرسانی خودکار هر دقیقه.">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Tahoma, sans-serif;background:linear-gradient(135deg,#0a1a1a,#1a4a4a,#66ccaa);color:#fff;text-align:center;padding:15px;min-height:100vh}
        .header{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border-radius:25px;padding:20px;margin-bottom:15px}
        .header h1{color:#ffd700;font-size:22px;margin-bottom: 5px;}
        .header p{font-size: 13px; color: #ddd;}
        .back-btn{display:inline-block;background:rgba(255,255,255,.15);color:#fff;padding:8px 20px;border-radius:20px;text-decoration:none;margin:10px 5px;font-size:14px;transition: 0.3s;}
        .back-btn:hover{background:rgba(255,255,255,.3)}
        .price-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
        .price-card{background:rgba(255,255,255,.05);border-radius:15px;padding:18px;border:1px solid rgba(255,255,255,.1);text-align:center}
        .price-card .emoji{font-size:35px}
        .price-card h3{font-size:13px;color:#ffd700;margin:5px 0}
        .price-card .price{font-size:22px;font-weight:bold;color:#0fc;text-shadow:0 0 10px #0fc}
        .price-card .change{font-size:12px}
        .up{color:#0f0}.down{color:#f00}
        .update{color:#aaa;font-size:11px;margin-top:20px}
        #loader{color:#ffd700;font-size:16px;margin:30px}
        .guide-btn{display:block;background:#ffd700;color:#0a1a1a;padding:12px;border-radius:12px;text-decoration:none;font-weight:bold;margin:20px auto;max-width:300px;font-size:16px}
    </style>
</head>
<body>
    <div class="header">
        <h1>💰 قیمت‌های لحظه‌ای</h1>
        <p>به‌روزرسانی خودکار از بازار آزاد</p>
    </div>
    
    <div>
        <a href="index.html" class="back-btn">🔙 خانه</a>
        <a href="gold2.html" class="back-btn">📚 راهنمای خرید</a>
    </div>

    <div id="loader">⏳ در حال دریافت قیمت‌ها...</div>

    <div id="prices-container" style="display:none;">
        <div class="price-grid" id="main-prices"></div>
        <h3 style="color:#ffd700;margin:15px 0">🪙 انواع سکه</h3>
        <div class="price-grid" id="coin-prices"></div>
        <h3 style="color:#ffd700;margin:15px 0">💱 ارزهای دیگه</h3>
        <div class="price-grid" id="currency-prices"></div>
    </div>

    <p class="update" id="last-update">⏰ آخرین بروزرسانی: --</p>
    
    <a href="gold2.html" class="guide-btn">📚 مطالعه راهنمای جامع خرید طلا</a>

    <script>
        function formatPrice(num) {
            if (!num) return "---";
            return Number(num).toLocaleString('fa-IR');
        }

        function formatChange(change) {
            if (change === undefined || change === null) return "";
            const isUp = change >= 0;
            const className = isUp ? "up" : "down";
            const arrow = isUp ? "▲" : "▼";
            return `<div class="change ${className}">${arrow} ${Math.abs(change).toFixed(1)}٪</div>`;
        }

        async function fetchPrices() {
            const loader = document.getElementById('loader');
            const container = document.getElementById('prices-container');
            const lastUpdate = document.getElementById('last-update');

            try {
                const response = await fetch('https://nerkh.jahankhahan.shop/data/live.json');
                const data = await response.json();

                const now = new Date();
                lastUpdate.textContent = `⏰ آخرین بروزرسانی: ${now.toLocaleTimeString('fa-IR')}`;

                let mainHtml = '';
                if (data.rates) {
                    const coinPrice = data.rates.coin || data.rates.gold;
                    mainHtml += `
                        <div class="price-card">
                            <div class="emoji">🪙</div>
                            <h3>سکه امامی</h3>
                            <div class="price">${formatPrice(coinPrice)}</div>
                            ${formatChange(data.change?.coin)}
                        </div>`;
                    
                    mainHtml += `
                        <div class="price-card">
                            <div class="emoji">🥇</div>
                            <h3>طلای ۱۸ عیار</h3>
                            <div class="price">${formatPrice(data.rates.gold)}</div>
                            ${formatChange(data.change?.gold)}
                        </div>`;

                    mainHtml += `
                        <div class="price-card">
                            <div class="emoji">💵</div>
                            <h3>دلار آمریکا</h3>
                            <div class="price">${formatPrice(data.rates.dollar)}</div>
                            ${formatChange(data.change?.dollar)}
                        </div>`;

                    mainHtml += `
                        <div class="price-card">
                            <div class="emoji">💶</div>
                            <h3>یورو</h3>
                            <div class="price">${formatPrice(data.rates.euro)}</div>
                            ${formatChange(data.change?.euro)}
                        </div>`;
                }
                document.getElementById('main-prices').innerHTML = mainHtml;

                let coinHtml = '';
                if (data.rates) {
                    const coins = [
                        { name: 'نیم سکه', key: 'half_coin' },
                        { name: 'ربع سکه', key: 'quarter_coin' },
                        { name: 'سکه گرمی', key: 'gram_coin' }
                    ];
                    coins.forEach(c => {
                        if (data.rates[c.key]) {
                            coinHtml += `
                                <div class="price-card">
                                    <h3>${c.name}</h3>
                                    <div class="price">${formatPrice(data.rates[c.key])}</div>
                                </div>`;
                        }
                    });
                }
                document.getElementById('coin-prices').innerHTML = coinHtml || '<p style="grid-column:1/-1;color:#aaa;">داده‌ای موجود نیست</p>';

                let currHtml = '';
                if (data.rates) {
                    const currencies = [
                        { name: '🇦🇪 درهم', key: 'aed' },
                        { name: '🇹🇷 لیر', key: 'try' },
                        { name: '🇨🇳 یوان', key: 'cny' }
                    ];
                    currencies.forEach(c => {
                        if (data.rates[c.key]) {
                            currHtml += `
                                <div class="price-card">
                                    <h3>${c.name}</h3>
                                    <div class="price">${formatPrice(data.rates[c.key])}</div>
                                </div>`;
                        }
                    });
                }
                document.getElementById('currency-prices').innerHTML = currHtml || '<p style="grid-column:1/-1;color:#aaa;">داده‌ای موجود نیست</p>';

                loader.style.display = 'none';
                container.style.display = 'block';

            } catch (error) {
                loader.innerHTML = '⚠️ خطا در دریافت اطلاعات. لطفاً فیلترشکن خود را روشن کنید یا صفحه را رفرش کنید.';
            }
        }
        fetchPrices();
        setInterval(fetchPrices, 60000);
    </script>
</body>
</html>
