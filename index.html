<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>💎 گنج یا بمب</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05080f;color:#e8eef7;
  font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
#fx{position:fixed;inset:0;pointer-events:none}

/* UI Overlay */
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;z-index:10}
#topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;
  background:linear-gradient(180deg,rgba(5,8,15,.9),transparent);pointer-events:auto}
.back-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);color:#e8eef7;cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;font-family:inherit;
  backdrop-filter:blur(10px);transition:all .2s}
.back-btn:active{transform:scale(.95);background:rgba(255,80,80,.2)}
.score-box{text-align:center}
.score-label{font-size:10px;color:#8899aa;letter-spacing:2px;margin-bottom:2px}
.score-value{font-size:22px;font-weight:900;color:#ffd700;font-variant-numeric:tabular-nums;
  text-shadow:0 0 20px rgba(255,215,0,.6)}
.bet-box{text-align:left}
.bet-label{font-size:10px;color:#8899aa;letter-spacing:2px;margin-bottom:2px}
.bet-value{font-size:18px;font-weight:900;color:#22c55e;font-variant-numeric:tabular-nums;
  text-shadow:0 0 20px rgba(34,197,94,.6)}

#bottom{position:absolute;bottom:0;left:0;right:0;padding:16px 20px 24px;
  background:linear-gradient(0deg,rgba(5,8,15,.95),transparent);pointer-events:auto}
.mult-row{text-align:center;margin-bottom:12px}
.mult-label{font-size:10px;color:#8899aa;letter-spacing:3px;margin-bottom:4px}
.mult-value{font-size:38px;font-weight:900;color:#ffd700;line-height:1;
  text-shadow:0 0 15px #ffd700,0 0 30px #ff8c00,0 0 50px #ff8c00;
  font-variant-numeric:tabular-nums;transition:transform .15s}
.mult-value.bump{transform:scale(1.3)}

#action{width:100%;padding:18px;font-size:18px;font-weight:900;border:none;
  border-radius:16px;cursor:pointer;font-family:inherit;letter-spacing:1px;
  background:linear-gradient(135deg,#22c55e,#16a34a);color:#002211;
  box-shadow:0 8px 0 #0f5c2e,0 12px 30px rgba(34,197,94,.4);
  transition:all .1s;text-shadow:0 1px 2px rgba(255,255,255,.3);position:relative;
  overflow:hidden;font-variant-numeric:tabular-nums}
#action::before{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  transform:translateX(-100%);animation:shimmer 2s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
#action:not(:disabled):active{transform:translateY(4px);
  box-shadow:0 4px 0 #0f5c2e,0 6px 20px rgba(34,197,94,.4)}
#action:disabled{opacity:.3;cursor:not-allowed;animation:none;
  background:linear-gradient(135deg,#444,#333);box-shadow:none}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(10px)}
#modal.show{opacity:1;pointer-events:auto}
.card{width:100%;max-width:340px;background:linear-gradient(145deg,#0f1626,#050810);
  border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:28px;
  text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.8);
  transform:scale(.85);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#modal.show .card{transform:scale(1)}
.card-icon{font-size:72px;margin-bottom:12px;filter:drop-shadow(0 0 30px currentColor);
  animation:iconBounce 1.5s ease-in-out infinite}
@keyframes iconBounce{0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-8px) scale(1.05)}}
.card-title{font-size:26px;font-weight:900;margin-bottom:6px}
.card-title.win{background:linear-gradient(90deg,#ffd700,#ff8c00);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.card-title.lose{color:#ef4444;text-shadow:0 0 20px rgba(239,68,68,.5)}
.card-sub{font-size:13px;color:#8899aa;margin-bottom:24px}
.card-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:22px}
.card-stat{padding:12px 6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  border-radius:12px}
.card-stat-label{font-size:9px;color:#8899aa;letter-spacing:1px;margin-bottom:3px}
.card-stat-value{font-size:18px;font-weight:bold;color:#ffd700;font-variant-numeric:tabular-nums}
.card-btn{width:100%;padding:14px;font-size:15px;font-weight:bold;border:none;
  border-radius:12px;cursor:pointer;font-family:inherit;margin-top:8px;
  transition:all .2s;letter-spacing:.5px}
.card-btn.primary{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;
  box-shadow:0 4px 20px rgba(255,180,0,.4)}
.card-btn.primary:active{transform:scale(.97)}
.card-btn.secondary{background:rgba(255,255,255,.08);color:#e8eef7;
  border:1px solid rgba(255,255,255,.1)}
.card-btn.secondary:active{background:rgba(255,255,255,.12)}
</style>
</head>
<body>

<canvas id="game"></canvas>
<canvas id="fx"></canvas>

<div id="ui">
  <div id="topbar">
    <button class="back-btn" id="backBtn">←</button>
    <div class="score-box">
      <div class="score-label">امتیاز</div>
      <div class="score-value" id="score">۰</div>
    </div>
    <div class="bet-box">
      <div class="bet-label">سود دور</div>
      <div class="bet-value" id="bet">۰</div>
    </div>
  </div>
  <div id="bottom">
    <div class="mult-row">
      <div class="mult-label">ضریب</div>
      <div class="mult-value" id="mult">×1.00</div>
    </div>
    <button id="action" disabled>شروع بازی</button>
  </div>
</div>

<div id="modal">
  <div class="card">
    <div class="card-icon" id="cardIcon">🏆</div>
    <div class="card-title" id="cardTitle">بردی!</div>
    <div class="card-sub" id="cardSub"></div>
    <div class="card-stats">
      <div class="card-stat"><div class="card-stat-label">سود</div>
        <div class="card-stat-value" id="cardGain">۰</div></div>
      <div class="card-stat"><div class="card-stat-label">کاشی</div>
        <div class="card-stat-value" id="cardPicks">۰</div></div>
      <div class="card-stat"><div class="card-stat-label">ضریب</div>
        <div class="card-stat-value" id="cardMult">×۱</div></div>
    </div>
    <button class="card-btn primary" id="nextBtn">دور بعد</button>
    <button class="card-btn secondary" id="homeBtn">بازگشت</button>
  </div>
</div>

<script>
'use strict';

/* ================== CONSTANTS ================== */
const COLS = 5, ROWS = 5, TOTAL = COLS * ROWS;
const BOMBS = 3, BASE = 100, INC = 0.25;
const C = {
  bg: '#05080f',
  stone1: '#243050', stone2: '#151d33', stone3: '#0a0f1a',
  blue: '#4da6ff', blueGlow: 'rgba(77,166,255,.6)',
  cyan: '#00e5ff', green: '#22c55e', red: '#ef4444',
  gold: '#ffd700', orange: '#ff8c00', purple: '#a855f7'
};

/* ================== STATE ================== */
const S = {
  score: 0, high: 0,
  active: false, picks: 0, mult: 1, roundVal: 0,
  tiles: [], // {revealed, type}
  shake: 0, flash: null,
  hoveredTile: -1, pressTile: -1
};

/* ================== CANVAS SETUP ================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const fxCanvas = document.getElementById('fx');
const fxCtx = fxCanvas.getContext('2d');
let W, H, DPR;
let boardX, boardY, tileSize, tileGap;
const particles = [];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  fxCanvas.width = W * DPR;
  fxCanvas.height = H * DPR;
  fxCanvas.style.width = W + 'px';
  fxCanvas.style.height = H + 'px';
  fxCtx.setTransform(DPR, 0, 0, DPR, 0, 0);

  layoutBoard();
}
window.addEventListener('resize', resize);

function layoutBoard() {
  const availableW = Math.min(W - 32, 420);
  const availableH = H - 260;
  const maxSize = Math.min(availableW, availableH);
  tileGap = 8;
  tileSize = (maxSize - tileGap * (COLS + 1)) / COLS;
  const boardW = tileSize * COLS + tileGap * (COLS + 1);
  const boardH = tileSize * ROWS + tileGap * (ROWS + 1);
  boardX = (W - boardW) / 2;
  boardY = (H - boardH) / 2 - 20;
}

function getTilePos(i) {
  const col = i % COLS, row = Math.floor(i / COLS);
  return {
    x: boardX + tileGap + col * (tileSize + tileGap),
    y: boardY + tileGap + row * (tileSize + tileGap),
    w: tileSize, h: tileSize
  };
}

/* ================== DRAWING HELPERS ================== */
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

// ===== Stone tile =====
function drawStoneTile(i, t, pressed) {
  const pos = getTilePos(i);
  const { x, y, w, h } = pos;
  const revealScale = t.revealProgress || 0;

  ctx.save();
  if (S.shake > 0) {
    ctx.translate((Math.random() - .5) * S.shake * 8, (Math.random() - .5) * S.shake * 8);
  }

  // outer shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.6)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 3;
  roundRect(ctx, x, y + 2, w, h, 12);
  ctx.fillStyle = '#050810';
  ctx.fill();
  ctx.restore();

  // scale down when pressed
  const scale = pressed ? 0.94 : 1;
  const cx = x + w / 2, cy = y + h / 2;
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.translate(-cx, -cy);

  if (revealScale > 0) {
    // === REVEALED ===
    drawRevealedTile(t, x, y, w, h, revealScale);
  } else {
    // === HIDDEN: carved stone ===
    const grad = ctx.createLinearGradient(x, y, x + w, y + h);
    grad.addColorStop(0, '#3a4a6a');
    grad.addColorStop(0.5, '#1f2b4d');
    grad.addColorStop(1, '#0e1628');
    roundRect(ctx, x, y, w, h, 12);
    ctx.fillStyle = grad;
    ctx.fill();

    // Bevel highlight (top-left)
    ctx.save();
    roundRect(ctx, x + 1.5, y + 1.5, w - 3, h - 3, 11);
    ctx.strokeStyle = 'rgba(140,180,255,.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    // Bevel shadow (bottom-right)
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x + w - 4, y + 8);
    ctx.lineTo(x + w - 4, y + h - 4);
    ctx.lineTo(x + 8, y + h - 4);
    ctx.strokeStyle = 'rgba(0,0,0,.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    // Inner glow
    const innerGlow = ctx.createRadialGradient(cx, cy - h * .15, 0, cx, cy, w * .7);
    innerGlow.addColorStop(0, 'rgba(100,150,255,.08)');
    innerGlow.addColorStop(1, 'rgba(0,0,0,0)');
    roundRect(ctx, x, y, w, h, 12);
    ctx.fillStyle = innerGlow;
    ctx.fill();

    // Rune (carved "?" shape)
    drawRune(cx, cy, w * 0.32, i);

    // Corner bolts
    drawBolt(x + 8, y + 8, 3);
    drawBolt(x + w - 8, y + 8, 3);
    drawBolt(x + 8, y + h - 8, 3);
    drawBolt(x + w - 8, y + h - 8, 3);
  }

  ctx.restore();
}

function drawRune(cx, cy, size, seed) {
  const pulse = 0.4 + Math.sin(performance.now() / 600 + seed) * 0.25;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = `rgba(77,166,255,${pulse})`;
  ctx.shadowColor = C.blueGlow;
  ctx.shadowBlur = 10;
  ctx.font = `bold ${size}px 'Segoe UI', Tahoma`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('?', 0, 0);
  ctx.restore();
}

function drawBolt(x, y, r) {
  const grad = ctx.createRadialGradient(x - r * .3, y - r * .3, 0, x, y, r);
  grad.addColorStop(0, '#8ab4ff');
  grad.addColorStop(1, '#2a3a5a');
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
}

function drawRevealedTile(t, x, y, w, h, prog) {
  const isBomb = t.type === 'bomb';
  const isGold = t.type === 'gold';
  const isShield = t.type === 'shield';

  // Background
  let bgGrad;
  if (isBomb) {
    bgGrad = ctx.createRadialGradient(x + w / 2, y + h / 2, 0, x + w / 2, y + h / 2, w);
    bgGrad.addColorStop(0, '#8b0000');
    bgGrad.addColorStop(1, '#1a0000');
  } else if (isGold) {
    bgGrad = ctx.createRadialGradient(x + w / 2, y + h / 2, 0, x + w / 2, y + h / 2, w);
    bgGrad.addColorStop(0, '#5a3a00');
    bgGrad.addColorStop(1, '#1a0f00');
  } else if (isShield) {
    bgGrad = ctx.createRadialGradient(x + w / 2, y + h / 2, 0, x + w / 2, y + h / 2, w);
    bgGrad.addColorStop(0, '#0a2a4a');
    bgGrad.addColorStop(1, '#021020');
  } else {
    bgGrad = ctx.createRadialGradient(x + w / 2, y + h / 2, 0, x + w / 2, y + h / 2, w);
    bgGrad.addColorStop(0, '#0a3a2a');
    bgGrad.addColorStop(1, '#021008');
  }
  roundRect(ctx, x, y, w, h, 12);
  ctx.fillStyle = bgGrad;
  ctx.fill();

  // Border glow
  ctx.save();
  roundRect(ctx, x + 1, y + 1, w - 2, h - 2, 11);
  ctx.strokeStyle = isBomb ? C.red : isGold ? C.gold : isShield ? C.blue : C.green;
  ctx.lineWidth = 2;
  ctx.shadowColor = isBomb ? C.red : isGold ? C.gold : isShield ? C.blue : C.green;
  ctx.shadowBlur = 15 * prog;
  ctx.stroke();
  ctx.restore();

  // Scale in the icon
  const cx = x + w / 2, cy = y + h / 2;
  ctx.save();
  ctx.translate(cx, cy);
  const s = prog < 1 ? prog * 1.2 : 1;
  ctx.scale(s, s);
  ctx.translate(-cx, -cy);

  if (isBomb) drawBomb(cx, cy, w * 0.55);
  else if (isGold) drawGold(cx, cy, w * 0.55);
  else if (isShield) drawShield(cx, cy, w * 0.5);
  else drawDiamond(cx, cy, w * 0.55);

  ctx.restore();
}

// ===== Diamond =====
function drawDiamond(cx, cy, size) {
  const s = size / 2;
  ctx.save();
  ctx.translate(cx, cy);

  // Glow
  ctx.shadowColor = C.cyan;
  ctx.shadowBlur = 25;

  // Main body
  ctx.beginPath();
  ctx.moveTo(0, -s);           // top
  ctx.lineTo(s * 0.7, -s * 0.3); // top-right
  ctx.lineTo(s * 0.5, s * 0.9);  // bottom-right
  ctx.lineTo(-s * 0.5, s * 0.9); // bottom-left
  ctx.lineTo(-s * 0.7, -s * 0.3);// top-left
  ctx.closePath();

  const grad = ctx.createLinearGradient(-s, -s, s, s);
  grad.addColorStop(0, '#e0ffff');
  grad.addColorStop(0.3, '#5ce1ff');
  grad.addColorStop(0.7, '#0099cc');
  grad.addColorStop(1, '#003d5c');
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.shadowBlur = 0;

  // Facet lines
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  // top facets
  ctx.moveTo(0, -s);
  ctx.lineTo(0, s * 0.9);
  ctx.moveTo(-s * 0.7, -s * 0.3);
  ctx.lineTo(0, s * 0.3);
  ctx.lineTo(s * 0.7, -s * 0.3);
  ctx.moveTo(0, s * 0.3);
  ctx.lineTo(-s * 0.5, s * 0.9);
  ctx.moveTo(0, s * 0.3);
  ctx.lineTo(s * 0.5, s * 0.9);
  ctx.stroke();

  // Top bright facet
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.95);
  ctx.lineTo(-s * 0.6, -s * 0.3);
  ctx.lineTo(0, s * 0.25);
  ctx.lineTo(s * 0.6, -s * 0.3);
  ctx.closePath();
  const topGrad = ctx.createLinearGradient(0, -s, 0, s * 0.3);
  topGrad.addColorStop(0, 'rgba(255,255,255,0.85)');
  topGrad.addColorStop(1, 'rgba(200,240,255,0.2)');
  ctx.fillStyle = topGrad;
  ctx.fill();

  // Sparkle
  const t = (performance.now() / 400) % 3;
  if (t < 1) {
    ctx.save();
    ctx.globalAlpha = t < 0.5 ? t * 2 : (1 - t) * 2;
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(-s * 0.4, -s * 0.4, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

// ===== Gold Coin =====
function drawGold(cx, cy, size) {
  const r = size / 2;
  ctx.save();
  ctx.translate(cx, cy);

  ctx.shadowColor = C.gold;
  ctx.shadowBlur = 25;

  // Outer ring
  const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  grad.addColorStop(0, '#fff8d0');
  grad.addColorStop(0.4, '#ffd700');
  grad.addColorStop(0.8, '#b8860b');
  grad.addColorStop(1, '#5a4000');
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.shadowBlur = 0;

  // Inner ring
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(90,64,0,0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // $ symbol
  ctx.fillStyle = '#8b6914';
  ctx.font = `bold ${r * 1.3}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('$', 0, r * 0.05);

  // Highlight arc
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.92, Math.PI * 1.15, Math.PI * 1.6);
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.restore();
}

// ===== Shield =====
function drawShield(cx, cy, size) {
  const s = size / 2;
  ctx.save();
  ctx.translate(cx, cy);

  ctx.shadowColor = '#4da6ff';
  ctx.shadowBlur = 20;

  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.lineTo(s * 0.8, -s * 0.6);
  ctx.lineTo(s * 0.8, s * 0.2);
  ctx.quadraticCurveTo(s * 0.8, s * 0.9, 0, s);
  ctx.quadraticCurveTo(-s * 0.8, s * 0.9, -s * 0.8, s * 0.2);
  ctx.lineTo(-s * 0.8, -s * 0.6);
  ctx.closePath();

  const grad = ctx.createLinearGradient(-s, -s, s, s);
  grad.addColorStop(0, '#a8d8ff');
  grad.addColorStop(0.5, '#4da6ff');
  grad.addColorStop(1, '#003d99');
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.shadowBlur = 0;

  // Inner cross
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.5);
  ctx.lineTo(0, s * 0.5);
  ctx.moveTo(-s * 0.4, 0);
  ctx.lineTo(s * 0.4, 0);
  ctx.stroke();

  ctx.restore();
}

// ===== Bomb =====
function drawBomb(cx, cy, size) {
  const r = size / 2;
  ctx.save();
  ctx.translate(cx, cy);

  ctx.shadowColor = '#ff3333';
  ctx.shadowBlur = 30;

  // Sphere
  const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  grad.addColorStop(0, '#666666');
  grad.addColorStop(0.4, '#2a2a2a');
  grad.addColorStop(1, '#000000');
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.shadowBlur = 0;

  // Highlight
  ctx.beginPath();
  ctx.arc(-r * 0.35, -r * 0.35, r * 0.18, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fill();

  // Fuse
  ctx.strokeStyle = '#8b4513';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(r * 0.3, -r * 0.7);
  ctx.quadraticCurveTo(r * 0.8, -r * 1.1, r * 0.5, -r * 1.4);
  ctx.stroke();

  // Flame (animated)
  const t = performance.now() / 80;
  const flameSize = 6 + Math.sin(t) * 3;
  ctx.shadowColor = '#ff6600';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#ff6600';
  ctx.beginPath();
  ctx.arc(r * 0.5, -r * 1.4, flameSize, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffff00';
  ctx.beginPath();
  ctx.arc(r * 0.5, -r * 1.4, flameSize * 0.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/* ================== AMBIENT PARTICLES ================== */
function spawnAmbientParticle() {
  particles.push({
    x: Math.random() * W,
    y: H + 10,
    vx: (Math.random() - 0.5) * 0.3,
    vy: -Math.random() * 0.5 - 0.2,
    life: 1, maxLife: 400,
    size: Math.random() * 2 + 0.5,
    color: Math.random() < 0.5 ? 'rgba(100,180,255,' : 'rgba(255,215,0,',
    type: 'ambient'
  });
}

function spawnBurst(cx, cy, color, count = 20, speed = 6) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = Math.random() * speed + 2;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2,
      life: 1, maxLife: 60 + Math.random() * 30,
      size: Math.random() * 3 + 1,
      color,
      grav: 0.2,
      type: 'burst'
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    if (p.grav) p.vy += p.grav;
    if (p.type === 'ambient') {
      p.vy *= 0.998;
      p.life = p.y / H;
    } else {
      p.life -= 1 / p.maxLife;
    }
    if (p.life <= 0 || p.y < -20 || p.y > H + 20) particles.splice(i, 1);
  }
}

function drawParticles() {
  fxCtx.clearRect(0, 0, W, H);
  fxCtx.save();
  for (const p of particles) {
    fxCtx.globalAlpha = Math.max(0, p.life);
    fxCtx.fillStyle = p.type === 'ambient' ? p.color + p.life * 0.5 + ')' : p.color;
    fxCtx.beginPath();
    fxCtx.arc(p.x, p.y, p.size * (p.type === 'ambient' ? 1 : p.life), 0, Math.PI * 2);
    fxCtx.fill();
  }
  fxCtx.restore();
}

/* ================== BACKGROUND ================== */
let bgStars = [];
function initBgStars() {
  bgStars = [];
  for (let i = 0; i < 80; i++) {
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.3,
      tw: Math.random() * Math.PI * 2,
      twS: Math.random() * 0.02 + 0.005
    });
  }
}

function drawBackground() {
  // Radial gradient
  const grad = ctx.createRadialGradient(W / 2, H * 0.3, 0, W / 2, H * 0.3, Math.max(W, H));
  grad.addColorStop(0, '#0e1a35');
  grad.addColorStop(0.5, '#080d1a');
  grad.addColorStop(1, '#03050a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (const s of bgStars) {
    s.tw += s.twS;
    const a = 0.3 + Math.sin(s.tw) * 0.3 + 0.3;
    ctx.fillStyle = `rgba(150,200,255,${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* ================== GAME STATE ================== */
function initBoard() {
  S.tiles = [];
  for (let i = 0; i < TOTAL; i++) {
    S.tiles.push({ revealed: false, type: null, revealProgress: 0 });
  }
  // Assign bombs
  const bombs = [];
  while (bombs.length < BOMBS) {
    const r = Math.floor(Math.random() * TOTAL);
    if (!bombs.includes(r)) bombs.push(r);
  }
  for (let i = 0; i < TOTAL; i++) {
    if (bombs.includes(i)) {
      S.tiles[i].type = 'bomb';
    } else {
      const r = Math.random();
      if (r < 0.76) S.tiles[i].type = 'diamond';
      else if (r < 0.93) S.tiles[i].type = 'gold';
      else S.tiles[i].type = 'shield';
    }
  }
}

function startGame() {
  S.active = true;
  S.picks = 0;
  S.mult = 1;
  S.roundVal = 0;
  initBoard();
  updateUI();
  updateButton();
  document.getElementById('modal').classList.remove('show');
}

function updateUI() {
  document.getElementById('score').textContent = Math.floor(S.score).toLocaleString('fa');
  document.getElementById('bet').textContent = Math.floor(S.roundVal).toLocaleString('fa');
  const m = document.getElementById('mult');
  m.textContent = '×' + S.mult.toFixed(2);
  m.classList.add('bump');
  setTimeout(() => m.classList.remove('bump'), 200);
}

function updateButton() {
  const btn = document.getElementById('action');
  if (!S.active) {
    btn.textContent = 'شروع بازی';
    btn.disabled = false;
    btn.onclick = startGame;
  } else if (S.picks === 0) {
    btn.textContent = 'روی کاشی‌ها بزن';
    btn.disabled = true;
  } else {
    btn.textContent = `💰 بکش بیرون (${Math.floor(S.roundVal).toLocaleString('fa')})`;
    btn.disabled = false;
    btn.onclick = cashOut;
  }
}

function pickTile(i) {
  if (!S.active) return;
  const t = S.tiles[i];
  if (t.revealed) return;
  t.revealed = true;
  t.revealProgress = 0.01;

  const pos = getTilePos(i);
  const cx = pos.x + pos.w / 2;
  const cy = pos.y + pos.h / 2;

  if (t.type === 'bomb') {
    S.shake = 1;
    spawnBurst(cx, cy, '#ef4444', 40, 10);
    spawnBurst(cx, cy, '#ffaa00', 20, 7);
    // reveal all bombs
    setTimeout(() => {
      S.tiles.forEach((tt, idx) => {
        if (tt.type === 'bomb' && !tt.revealed) {
          tt.revealed = true;
          tt.revealProgress = 0.01;
        }
      });
    }, 300);
    setTimeout(() => endRound(false), 800);
  } else {
    S.picks++;
    let gain = Math.floor(BASE * S.mult);
    if (t.type === 'gold') gain *= 3;
    if (t.type === 'shield') {
      spawnBurst(cx, cy, '#4da6ff', 20, 6);
    } else {
      spawnBurst(cx, cy, t.type === 'gold' ? '#ffd700' : '#00e5ff', 15, 5);
    }
    S.roundVal += gain;
    S.mult = 1 + S.picks * INC;
    updateUI();
    updateButton();

    if (S.picks === TOTAL - BOMBS) {
      setTimeout(() => endRound(true), 500);
    }
  }
}

function cashOut() {
  if (!S.active || S.picks === 0) return;
  endRound(true);
}

function endRound(won) {
  S.active = false;
  const gain = won ? S.roundVal : 0;
  if (won) {
    S.score += gain;
    if (S.score > S.high) S.high = S.score;
    for (let i = 0; i < 3; i++) {
      setTimeout(() => {
        spawnBurst(W / 2 + (Math.random() - .5) * 200, H / 2 + (Math.random() - .5) * 200, '#ffd700', 30, 8);
      }, i * 150);
    }
  }

  document.getElementById('cardIcon').textContent = won ? '🏆' : '💥';
  const title = document.getElementById('cardTitle');
  title.textContent = won ? 'بردی!' : 'باختی!';
  title.className = 'card-title ' + (won ? 'win' : 'lose');
  document.getElementById('cardSub').textContent = won ? 'سودت رو گرفتی' : 'بمب زدی!';
  document.getElementById('cardGain').textContent = won ? '+' + Math.floor(gain).toLocaleString('fa') : '۰';
  document.getElementById('cardPicks').textContent = S.picks + '/' + (TOTAL - BOMBS);
  document.getElementById('cardMult').textContent = '×' + S.mult.toFixed(2);
  document.getElementById('modal').classList.add('show');

  document.getElementById('score').textContent = Math.floor(S.score).toLocaleString('fa');
}

/* ================== INPUT ================== */
function getTileFromPoint(px, py) {
  for (let i = 0; i < TOTAL; i++) {
    const p = getTilePos(i);
    if (px >= p.x && px <= p.x + p.w && py >= p.y && py <= p.y + p.h) {
      return i;
    }
  }
  return -1;
}

canvas.addEventListener('pointerdown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const i = getTileFromPoint(x, y);
  if (i >= 0) {
    S.pressTile = i;
  }
});

canvas.addEventListener('pointerup', (e) => {
  if (S.pressTile < 0) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const i = getTileFromPoint(x, y);
  const pressed = S.pressTile;
  S.pressTile = -1;
  if (i === pressed && i >= 0) {
    pickTile(i);
  }
});

canvas.addEventListener('pointercancel', () => {
  S.pressTile = -1;
});

canvas.addEventListener('pointermove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  S.hoveredTile = getTileFromPoint(x, y);
});

/* ================== UI BUTTONS ================== */
document.getElementById('backBtn').onclick = () => {
  if (S.active && !confirm('بازی فعلی لغو شود؟')) return;
  S.active = false;
  document.getElementById('modal').classList.remove('show');
  updateButton();
};
document.getElementById('nextBtn').onclick = startGame;
document.getElementById('homeBtn').onclick = () => {
  document.getElementById('modal').classList.remove('show');
  S.active = false;
  updateButton();
};

/* ================== MAIN LOOP ================== */
let lastT = performance.now();
let ambientTimer = 0;

function loop(now) {
  const dt = Math.min(now - lastT, 50);
  lastT = now;

  // Decrease shake
  if (S.shake > 0) S.shake -= dt * 0.003;
  if (S.shake < 0) S.shake = 0;

  // Update reveal progress
  for (const t of S.tiles) {
    if (t.revealProgress > 0 && t.revealProgress < 1) {
      t.revealProgress = Math.min(1, t.revealProgress + dt * 0.005);
    }
  }

  // Spawn ambient particles
  ambientTimer += dt;
  if (ambientTimer > 100) {
    ambientTimer = 0;
    if (particles.filter(p => p.type === 'ambient').length < 30) {
      spawnAmbientParticle();
    }
  }

  // Draw
  drawBackground();
  for (let i = 0; i < TOTAL; i++) {
    drawStoneTile(i, S.tiles[i], i === S.pressTile);
  }

  updateParticles(dt);
  drawParticles();

  requestAnimationFrame(loop);
}

/* ================== BOOT ================== */
resize();
initBgStars();
window.addEventListener('resize', () => {
  resize();
  initBgStars();
});
initBoard();
updateUI();
updateButton();
requestAnimationFrame(loop);
</script>
