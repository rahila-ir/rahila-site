<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 آرکید ۱۰۰ بازی (۵۱-۱۵۰) | رهیلاناب</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-inner: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --accent: #10b981;
            --gold: #f59e0b;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --radius: 16px;
        }

        body.light-mode {
            --bg-main: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.7);
            --bg-inner: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: rgba(0, 0, 0, 0.05);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s, color 0.3s, border-color 0.3s, transform 0.3s, box-shadow 0.3s; font-family: 'Vazirmatn', sans-serif; }
        
        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
            line-height: 1.6;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px);
            padding: 15px 25px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        body.light-mode .header { background: rgba(255, 255, 255, 0.7); }
        
        .header-title { 
            font-size: 20px; font-weight: 900; 
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.3));
        }
        
        .icon-btn {
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main);
            width: 42px; height: 42px; border-radius: 12px; font-size: 20px; cursor: pointer;
            display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px);
        }
        .icon-btn:hover { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

        .container {
            max-width: 1300px; margin: 0 auto; padding: 30px 20px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px;
        }

        .game-card {
            background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 25px; box-shadow: var(--shadow); display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        
        .game-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent)); opacity: 0.8;
        }

        .game-card:hover { transform: translateY(-5px); border-color: rgba(139, 92, 246, 0.4); box-shadow: 0 15px 40px rgba(0,0,0,0.4), 0 0 20px var(--primary-glow); }

        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px dashed var(--border); }
        .game-title { font-size: 16px; font-weight: 800; color: var(--text-main); }
        .game-score { font-size: 14px; font-weight: 900; color: var(--accent); background: rgba(16, 185, 129, 0.1); padding: 2px 10px; border-radius: 8px; border: 1px solid rgba(16, 185, 129, 0.2); }
        .game-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }

        button { background: linear-gradient(135deg, var(--primary), #6d28d9); color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin: 4px; outline: none; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.2); }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4); }
        button:active { transform: translateY(0); }
        button.secondary { background: var(--bg-inner); color: var(--text-main); border: 1px solid var(--border); box-shadow: none; }
        button.secondary:hover { border-color: var(--primary); }
        button.success { background: linear-gradient(135deg, var(--accent), #059669); }
        button.danger { background: linear-gradient(135deg, var(--danger), #b91c1c); }

        input, select { background: var(--bg-inner); border: 1px solid var(--border); color: var(--text-main); padding: 12px 15px; border-radius: 10px; font-size: 15px; outline: none; text-align: center; margin: 5px; width: 100%; max-width: 200px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }

        .result-text { margin-top: 15px; font-weight: 800; font-size: 15px; color: var(--gold); text-align: center; min-height: 20px; }
        .emoji-big { font-size: 50px; margin: 15px 0; text-align: center; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3)); }
        
        .grid-game { display: grid; gap: 8px; margin: 10px 0; }
        .grid-btn { background: var(--bg-inner); border: 1px solid var(--border); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 16px; cursor: pointer; color: var(--text-main); box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 10px; }
        .grid-btn:hover { border-color: var(--primary); background: rgba(139, 92, 246, 0.1); transform: scale(1.05); }
        .grid-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
        .grid-btn.matched { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }

        canvas { background: var(--bg-inner); border-radius: 12px; border: 1px solid var(--border); margin: 10px auto; display: block; max-width: 100%; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2); }

        #backToTop { position: fixed; bottom: 30px; left: 30px; width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border: none; font-size: 22px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 5px 20px var(--primary-glow); opacity: 0; visibility: hidden; z-index: 9999; }
        #backToTop.show { opacity: 1; visibility: visible; }
        #backToTop:hover { transform: translateY(-5px) scale(1.1); box-shadow: 0 10px 30px var(--accent); }

        .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.5, 0, 0, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }

        @media (max-width: 500px) { .container { padding: 15px 10px; gap: 20px; } .game-card { padding: 20px 15px; } .header { padding: 12px 15px; } .header-title { font-size: 18px; } }
    </style>
</head>

    const container = $('games-container');
    gamesData.forEach((game, index) => {
        const card = document.createElement('div');
        card.className = 'game-card reveal';
        card.innerHTML = `
            <div class="game-header">
                <span class="game-title">${game.title}</span>
                <span class="game-score" id="score-${index}">0</span>
            </div>
            <div class="game-content" id="game-${index}"></div>
        `;
        container.appendChild(card);
        game.render(index);
    });

    // Reveal Observer
    const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) { entry.target.classList.add('active'); revealObserver.unobserve(entry.target); }
        });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

    // ==========================================

    function renderPong(idx) { /* ... simplified for brevity ... */ $(`game-${idx}`).innerHTML = `<div style="color:var(--text-muted)">Pong Game (Canvas)</div><button class="secondary" onclick="alert('پینگ پنگ روی سایت اصلی فعال است!')">شروع</button>`; }
    function renderCard(idx) { $(`game-${idx}`).innerHTML = `<button onclick="drawCard(${idx})">بکش</button><div class="result-text" id="res-${idx}"></div>`; window[`drawCard_${idx}`] = () => { let c=['🃑','🃒','🃓','🃔','🃕'][rand(5)]; $(`res-${idx}`).innerText = c; }; }
    function renderPiano(idx) { $(`game-${idx}`).innerHTML = `<button onclick="playNote(262)">دو</button><button onclick="playNote(330)">می</button><button onclick="playNote(392)">سل</button>`; }

    function renderBallBounce(idx) {

    }

    // 146. Country Flag
    function renderCountryFlag(idx) {
        $(`game-${idx}`).innerHTML = `<div class="emoji-big">🇫🇷</div>
            <div style="display:flex;gap:5px;">
                <button onclick="alert('✅')">فرانسه</button>
                <button onclick="alert('❌')">آلمان</button>
            </div>`;
    }

    // 147. Find Animal
    function renderFindAnimal(idx) {
        $(`game-${idx}`).innerHTML = `<div class="result-text">هدف: 🐱</div>
            <div class="grid-game" style="grid-template-columns:repeat(3, 50px);" id="fa-g-${idx}"></div>`;
        let g = $(`fa-g-${idx}`);
        let t = rand(9);
        for(let i=0;i<9;i++) {
            let c = document.createElement('div'); c.className='grid-btn'; c.style.height='50px';
            c.innerText = i===t ? '🐱' : '🐶';
            c.onclick = () => { if(i===t) alert('✅'); else alert('❌'); };
            g.appendChild(c);
        }
    }

    // 148. Memory Pairs
    function renderMemoryPairs(idx) {
        $(`game-${idx}`).innerHTML = `<div class="grid-game" style="grid-template-columns:repeat(4, 40px);" id="mp-g-${idx}"></div>`;
        let g = $(`mp-g-${idx}`);
        let emojis = ['🍎','🍊','🍋','🍉'];
        let deck = [...emojis, ...emojis].sort(()=>Math.random()-0.5);
        let flipped = [], lock = false;
        deck.forEach((e, i) => {
            let c = document.createElement('div'); c.className='grid-btn'; c.style.height='40px'; c.style.color='transparent'; c.innerText=e;
            c.onclick = () => {
                if(lock || c.classList.contains('active')) return;
                c.classList.add('active'); c.style.color='#fff'; flipped.push({c, e});
                if(flipped.length===2) {
                    if(flipped[0].e === flipped[1].e) { flipped=[]; }
                    else { lock=true; setTimeout(()=>{ flipped.forEach(f=>{f.c.classList.remove('active'); f.c.style.color='transparent'}); flipped=[]; lock=false; }, 800); }
                }
            };
            g.appendChild(c);
        });
    }

    // 149. Hanoi
    function renderHanoi(idx) {
        $(`game-${idx}`).innerHTML = `<div class="result-text">برج هانوی ۳ دیسکی</div>
            <div style="display:flex; justify-content:space-around; align-items:flex-end; height:80px; border-bottom:2px solid #fff; margin-top:10px;">

                <div style="width:10px; height:100%; background:var(--bg-inner);"></div>
            </div>`;
    }

    function renderFinalCelebration(idx) {

            <button onclick="alert('🎉🥳🎉')" style="background:var(--gold);color:#000;padding:15px 30px;">🥳 جشن بزرگ</button>`;
    }

</script>
