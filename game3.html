<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 ۵۰ بازی اعتیادآور | آرکید رهیلاناب</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    
    <style>
        /* ============== تم شیشه‌ای لوکس ============== */
        :root {
            --bg-main: #0b1120; --bg-card: rgba(30, 41, 59, 0.6); --bg-inner: #0f172a;
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --primary: #8b5cf6; --primary-glow: rgba(139, 92, 246, 0.4);
            --accent: #10b981; --gold: #f59e0b; --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.08); --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        body.light-mode {
            --bg-main: #f1f5f9; --bg-card: rgba(255, 255, 255, 0.7); --bg-inner: #ffffff;
            --text-main: #0f172a; --text-muted: #64748b; --border: rgba(0, 0, 0, 0.05); --shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s, color 0.3s, border-color 0.3s, transform 0.2s; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--bg-main); background-image: radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%); color: var(--text-main); min-height: 100vh; padding-bottom: 50px; line-height: 1.6; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .header { position: sticky; top: 0; z-index: 1000; background: rgba(11, 17, 32, 0.7); backdrop-filter: blur(20px); padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        body.light-mode .header { background: rgba(255, 255, 255, 0.7); }
        .header-title { font-size: 20px; font-weight: 900; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.3)); }
        .icon-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); width: 42px; height: 42px; border-radius: 12px; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .icon-btn:hover { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

        .container { max-width: 1300px; margin: 0 auto; padding: 30px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .game-card { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .game-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--primary), var(--accent)); opacity: 0.8; }
        .game-card:hover { transform: translateY(-3px); border-color: rgba(139, 92, 246, 0.4); box-shadow: 0 15px 40px rgba(0,0,0,0.4), 0 0 20px var(--primary-glow); }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
        .game-title { font-size: 15px; font-weight: 800; color: var(--text-main); }
        .game-score { font-size: 13px; font-weight: 900; color: var(--accent); background: rgba(16, 185, 129, 0.1); padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(16, 185, 129, 0.2); }
        .game-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }

        button { background: linear-gradient(135deg, var(--primary), #6d28d9); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; margin: 3px; outline: none; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.2); }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4); }
        button.secondary { background: var(--bg-inner); color: var(--text-main); border: 1px solid var(--border); box-shadow: none; }
        button.success { background: linear-gradient(135deg, var(--accent), #059669); }
        button.danger { background: linear-gradient(135deg, var(--danger), #b91c1c); }

        input, select { background: var(--bg-inner); border: 1px solid var(--border); color: var(--text-main); padding: 10px; border-radius: 8px; font-size: 14px; outline: none; text-align: center; margin: 4px; width: 100%; max-width: 150px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
        .result-text { margin-top: 10px; font-weight: 800; font-size: 14px; color: var(--gold); text-align: center; min-height: 20px; }
        .grid-game { display: grid; gap: 6px; margin: 8px 0; }
        .grid-btn { background: var(--bg-inner); border: 1px solid var(--border); border-radius: 8px; display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 16px; cursor: pointer; color: var(--text-main); padding: 8px; aspect-ratio: 1; }
        .grid-btn:hover { border-color: var(--primary); background: rgba(139, 92, 246, 0.1); transform: scale(1.05); }
        
        #backToTop { position: fixed; bottom: 20px; left: 20px; width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border: none; font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 5px 20px var(--primary-glow); opacity: 0; visibility: hidden; z-index: 9999; }
        #backToTop.show { opacity: 1; visibility: visible; }
        
        @media (max-width: 500px) { .container { padding: 15px 10px; gap: 15px; } .game-card { padding: 15px; } }
    </style>
</head>
<body>

<div class="header">
    <div class="header-title">🎮 ۵۰ بازی اعتیادآور</div>
    <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
</div>

<div class="container" id="games-container">
    <!-- Games injected via JS -->
</div>

<button id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">🚀</button>

<script>
    // =============== Core Setup ===============
    function toggleTheme() { document.body.classList.toggle('light-mode'); const isLight = document.body.classList.contains('light-mode'); document.getElementById('theme-btn').innerText = isLight ? '☀️' : '🌙'; localStorage.setItem('arcade50Theme', isLight); }
    if (localStorage.getItem('arcade50Theme') === 'true') toggleTheme();
    const backToTopBtn = document.getElementById('backToTop');
    window.addEventListener('scroll', () => { if (window.scrollY > 400) backToTopBtn.classList.add('show'); else backToTopBtn.classList.remove('show'); });

    const $ = id => document.getElementById(id);
    const rand = max => Math.floor(Math.random() * max);
    const rInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    const gamesData = [
        // --- Speed & Reflex ---
        { title: "۱. ⚡ زمان واکنش", render: gReact },
        { title: "۲. 👆 تپ سریع", render: gTapFast },
        { title: "۳. 🎯 نشانه‌گیری", render: gAim },
        { title: "۴. 🧺 گرفتن توپ", render: gCatch },
        { title: "۵. 👉 چپ یا راست", render: gLeftRight },
        { title: "۶. 🎨 تطبیق رنگ", render: gColorMatch },
        { title: "۷. 🔢 پیدا کردن عدد", render: gFindNum },
        { title: "۸. 🦘 پرش سریع", render: gJump },
        { title: "۹. 🔨 شکار موش", render: gMole },
        { title: "۱۰. 🚦 واکنش رنگی", render: gReactColor },

        // --- Brain & Logic ---
        { title: "۱۱. 🧮 ریاضی سریع", render: gMath },
        { title: "۱۲. ➕ جمع ایموجی", render: gEmojiMath },
        { title: "۱۳. 📈 دنباله اعداد", render: gSeq },
        { title: "۱۴. ⬆️ بالاتر/پایین‌تر", render: gHigherLower },
        { title: "۱۵. 🔢 عدد گمشده", render: gMissingNum },
        { title: "۱۶. 💻 باینری", render: gBinary },
        { title: "۱۷. 🔍 عدد اول", render: gPrime },
        { title: "۱۸. 🧠 تست استروپ", render: gStroop },
        { title: "۱۹. ⚖️ درست/غلط", render: gTrueFalse },
        { title: "۲۰. 🧩 معما", render: gRiddle },

        // --- Memory & Pattern ---
        { title: "۲۱. 🃏 جفت‌یابی", render: gMemory },
        { title: "۲۲. 🎵 سایمون", render: gSimon },
        { title: "۲۳. 🟩 الگوی رنگی", render: gPattern },
        { title: "۲۴. 🔢 حافظه عددی", render: gMemNum },
        { title: "۲۵. 🎹 پیانو", render: gPiano },
        { title: "۲۶. 🔠 حافظه حروف", render: gMemLetter },
        { title: "۲۷. 🟦 دنباله روشن", render: gSeqLight },
        { title: "۲۸. 👁️ کدام عوض شد؟", render: gWhatChanged },
        { title: "۲۹. 📸 حافظه تصویر", render: gImgMem },
        { title: "۳۰. 🧩 جورچین", render: gPuzzle },

        // --- Words & Text ---
        { title: "۳۱. 🔤 درهم", render: gScramble },
        { title: "۳۲. 🔄 آناگرام", render: gAnagram },
        { title: "۳۳. ⌨️ سرعت تایپ", render: gTyping },
        { title: "۳۴. 📝 حدس کلمه", render: gWordGuess },
        { title: "۳۵. 🔠 کلمه‌ساز", render: gWordMaker },
        { title: "۳۶. 🌍 پایتخت", render: gCapital },
        { title: "۳۷. ✍️ عددنویس", render: gNumWords },
        { title: "۳۸. 📖 معنی کلمه", render: gMeaning },
        { title: "۳۹. 🔤 حرف‌یاب", render: gLetterFind },
        { title: "۴۰. 📞 تقلید صدا", render: gAnimalSound },

        // --- Chance & Classic ---
        { title: "۴۱. 🎲 تاس", render: gDice },
        { title: "۴۲. 🪙 شیر/خط", render: gCoin },
        { title: "۴۳. 🎡 گردونه", render: gWheel },
        { title: "۴۴. ✊ RPS", render: gRPS },
        { title: "۴۵. 🖖 RPSLS", render: gRPSLS },
        { title: "۴۶. 🃏 بلک‌جک", render: gBlackjack },
        { title: "۴۷. 🎱 جادویی", render: gMagic8 },
        { title: "۴۸. 🔮 فال", render: gFortune },
        { title: "۴۹. 🎰 اسلات", render: gSlot },
        { title: "۵۰. 🎉 جشن", render: gCelebrate }
    ];

    const container = $('games-container');
    gamesData.forEach((game, idx) => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
            <div class="game-header">
                <span class="game-title">${game.title}</span>
                <span class="game-score" id="sc-${idx}">0</span>
            </div>
            <div class="game-content" id="game-${idx}"></div>
        `;
        container.appendChild(card);
        game.render(idx);
    });

    // ==========================================
    // GAME LOGIC (50 Implementations)
    // ==========================================

    function gReact(idx) {
        $(`game-${idx}`).innerHTML = `<button id="b-${idx}" onclick="actReact(${idx})" class="secondary" style="width:100%;height:60px;">شروع</button><div class="result-text" id="r-${idx}"></div>`;
    }
    function actReact(idx) {
        const b = $(`b-${idx}`);
        if(b.innerText === 'شروع') { b.innerText = 'صبر...'; b.style.background = 'var(--danger)'; setTimeout(() => { b.innerText = 'بزن!'; b.style.background = 'var(--accent)'; window[`rt-${idx}`] = Date.now(); }, rInt(1000,3000)); }
        else if(b.innerText === 'بزن!') { $(`r-${idx}`).innerText = `⏱️ ${Date.now() - window[`rt-${idx}`]} ms`; b.innerText = 'شروع'; b.style.background = 'var(--bg-inner)'; }
    }

    function gTapFast(idx) {
        $(`game-${idx}`).innerHTML = `<button id="b-${idx}" onclick="actTap(${idx})" class="secondary" style="width:100%;height:60px;">شروع</button>`;
        window[`tpc-${idx}`] = 0;
    }
    function actTap(idx) {
        const b = $(`b-${idx}`);
        if(b.innerText === 'شروع') { window[`tpc-${idx}`] = 0; b.innerText = 'بزن!'; clearInterval(window[`tpi-${idx}`]); window[`tpi-${idx}`] = setInterval(() => { if(window[`tpt-${idx}`] <= 0) { clearInterval(window[`tpi-${idx}`]); b.innerText = 'شروع مجدد'; $(`sc-${idx}`).innerText = window[`tpc-${idx}`]; } }, 100); window[`tpt-${idx}`] = 5; }
        else if(b.innerText === 'بزن!') { window[`tpc-${idx}`]++; $(`sc-${idx}`).innerText = window[`tpc-${idx}`]; }
    }

    function gAim(idx) {
        $(`game-${idx}`).innerHTML = `<div style="width:100%;height:100px;background:var(--bg-inner);position:relative;border-radius:8px;" onclick="actAim(${idx}, event)"><div id="tg-${idx}" style="width:20px;height:20px;background:red;border-radius:50%;position:absolute;top:40px;left:40px;"></div></div>`;
    }
    function actAim(idx, e) {
        let r = e.target.getBoundingClientRect();
        let t = $(`tg-${idx}`);
        let x = e.clientX - r.left, y = e.clientY - r.top;
        if(Math.hypot(x - (parseInt(t.style.left)+10), y - (parseInt(t.style.top)+10)) < 20) { $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText) + 10; }
        t.style.top = rand(80) + 'px'; t.style.left = rand(250) + 'px';
    }

    function gCatch(idx) {
        $(`game-${idx}`).innerHTML = `<div style="width:100%;height:100px;border-bottom:2px solid var(--primary);position:relative;overflow:hidden;" id="ct-${idx}"><div id="cb-${idx}" style="width:15px;height:15px;background:var(--gold);border-radius:50%;position:absolute;top:0;left:50%;"></div></div><button onclick="actCatch(${idx})">گرفتن</button>`;
        window[`cbx-${idx}`] = 50;
        setInterval(() => { let b = $(`cb-${idx}`); if(!b) return; let y = parseInt(b.style.top) || 0; y += 2; if(y > 90) { y = 0; b.style.left = rand(90) + '%'; } b.style.top = y + 'px'; }, 50);
    }
    function actCatch(idx) {
        let b = $(`cb-${idx}`);
        if(parseInt(b.style.top) > 80) { $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText) + 10; b.style.top = '0px'; }
    }

    function gLeftRight(idx) { $(`game-${idx}`).innerHTML = `<div style="display:flex;gap:10px;"><button onclick="actLR(${idx},'L')">⬅</button><button onclick="actLR(${idx},'R')">➡</button></div><div class="result-text" id="r-${idx}"></div>`; }
    function actLR(idx, c) { let r = Math.random()<0.5?'L':'R'; $(`r-${idx}`).innerText = c===r?'✅ درست':'❌ اشتباه'; }

    function gColorMatch(idx) {
        $(`game-${idx}`).innerHTML = `<div id="cbx-${idx}" style="width:50px;height:50px;border-radius:50%;margin-bottom:10px;background:#333;"></div><div style="display:flex;gap:5px;"><button onclick="actCol(${idx},'red')" style="background:red;">قرمز</button><button onclick="actCol(${idx},'blue')" style="background:blue;">آبی</button></div>`;
        window[`ctg-${idx}`] = ['red','blue'][rand(2)]; $(`cbx-${idx}`).style.background = window[`ctg-${idx}`];
    }
    function actCol(idx, c) { if(c === window[`ctg-${idx}`]) { $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+5; window[`ctg-${idx}`] = ['red','blue'][rand(2)]; $(`cbx-${idx}`).style.background = window[`ctg-${idx}`]; } }

    function gFindNum(idx) {
        let target = rInt(10, 99);
        $(`game-${idx}`).innerHTML = `<div class="result-text">پیدا کن: ${target}</div><div class="grid-game" style="grid-template-columns:repeat(3, 1fr);" id="fg-${idx}"></div>`;
        let g = $(`fg-${idx}`);
        for(let i=0; i<9; i++) {
            let b = document.createElement('div'); b.className = 'grid-btn'; b.innerText = i===4?target:rInt(10,99);
            b.onclick = () => { if(b.innerText == target) { $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; gFindNum(idx); } };
            g.appendChild(b);
        }
    }

    function gJump(idx) { $(`game-${idx}`).innerHTML = `<div id="j-${idx}" style="font-size:40px;transition:0.2s;">🦘</div><button onclick="actJump(${idx})">پرش</button>`; }
    function actJump(idx) { let j = $(`j-${idx}`); j.style.transform = 'translateY(-30px)'; setTimeout(() => j.style.transform = 'translateY(0)', 200); $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+1; }

    function gMole(idx) {
        $(`game-${idx}`).innerHTML = `<div class="grid-game" style="grid-template-columns:repeat(3, 1fr);" id="mg-${idx}"></div>`;
        let g = $(`mg-${idx}`);
        for(let i=0; i<9; i++) { let c = document.createElement('div'); c.className='grid-btn'; c.id=`m-${idx}-${i}`; c.onclick = () => { if(c.innerText === '🐹') { c.innerText = ''; $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; } }; g.appendChild(c); }
        setInterval(() => { let r = rand(9); let e = $(`m-${idx}-${r}`); if(e && e.innerText === '') e.innerText = '🐹'; setTimeout(() => { if(e) e.innerText = ''; }, 800); }, 1000);
    }

    function gReactColor(idx) { $(`game-${idx}`).innerHTML = `<div id="rc-${idx}" style="width:50px;height:50px;margin:10px auto;background:red;transition:0.3s;"></div><button onclick="actRC(${idx})">زدم!</button>`; }

    function gMath(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}" style="font-size:20px;"></div><input type="number" id="i-${idx}" placeholder="جواب"><button onclick="actMath(${idx})">بررسی</button>`; let a=rInt(1,20), b=rInt(1,20); window[`ma-${idx}`] = a+b; $(`q-${idx}`).innerText = `${a}+${b}`; }
    function actMath(idx) { if(parseInt($(`i-${idx}`).value) === window[`ma-${idx}`]) { $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; gMath(idx); } }

    function gEmojiMath(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}"></div><input type="number" id="i-${idx}" placeholder="جواب"><button onclick="actEMath(${idx})">بررسی</button>`; let a=rInt(1,5), b=rInt(1,5); window[`ema-${idx}`] = a+b; $(`q-${idx}`).innerText = `🍎(${a}) + 🍌(${b})`; }
    function actEMath(idx) { if(parseInt($(`i-${idx}`).value) === window[`ema-${idx}`]) { $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; gEmojiMath(idx); } }

    function gSeq(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}"></div><input type="number" id="i-${idx}" placeholder="جواب"><button onclick="actSeq(${idx})">بررسی</button>`; let s=rInt(1,5), d=rInt(2,5); window[`sq-${idx}`] = s+d*3; $(`q-${idx}`).innerText = `${s}, ${s+d}, ${s+d*2}, ?`; }
    function actSeq(idx) { if(parseInt($(`i-${idx}`).value) === window[`sq-${idx}`]) { $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; gSeq(idx); } }

    function gHigherLower(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}" style="font-size:24px;">50</div><div style="display:flex;gap:5px;"><button onclick="actHL(${idx},'h')">⬆</button><button onclick="actHL(${idx},'l')">⬇</button></div>`; window[`hlc-${idx}`]=50; window[`hln-${idx}`]=rInt(1,100); }
    function actHL(idx, d) { let c=window[`hlc-${idx}`], n=window[`hln-${idx}`]; if((d==='h'&&n>c)||(d==='l'&&n<c)) $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+5; window[`hlc-${idx}`]=n; window[`hln-${idx}`]=rInt(1,100); $(`q-${idx}`).innerText = n; }

    function gMissingNum(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}"></div><input type="number" id="i-${idx}"><button onclick="actMN(${idx})">بررسی</button>`; let s=rInt(1,5), st=rInt(2,4); window[`mn-${idx}`] = s+st*2; $(`q-${idx}`).innerText = `${s}, ${s+st}, ?, ${s+st*3}`; }
    function actMN(idx) { if(parseInt($(`i-${idx}`).value) === window[`mn-${idx}`]) { $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; gMissingNum(idx); } }

    function gBinary(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}"></div><input type="number" id="i-${idx}"><button onclick="actBin(${idx})">بررسی</button>`; let n=rInt(2,15); window[`bn-${idx}`]=n; $(`q-${idx}`).innerText = n.toString(2); }
    function actBin(idx) { if(parseInt($(`i-${idx}`).value) === window[`bn-${idx}`]) { $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; gBinary(idx); } }

    function gPrime(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}" style="font-size:24px;"></div><div style="display:flex;gap:5px;"><button onclick="actPrime(${idx},1)">اول</button><button onclick="actPrime(${idx},0)">نیست</button></div>`; let n=rInt(2,30); window[`pn-${idx}`]=n; let isP=true; for(let i=2;i<n;i++) if(n%i===0) isP=false; window[`pa-${idx}`]=isP; $(`q-${idx}`).innerText = n; }
    function actPrime(idx, g) { if((g===1) === window[`pa-${idx}`]) { $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; gPrime(idx); } }

    function gStroop(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}" style="font-size:24px;font-weight:bold;"></div><div style="display:flex;gap:5px;"><button onclick="actStr(${idx},'red')" style="background:red">قرمز</button><button onclick="actStr(${idx},'blue')" style="background:blue">آبی</button></div>`; let c=['red','blue'][rand(2)], t=['red','blue'][rand(2)]; window[`sta-${idx}`]=c; $(`q-${idx}`).innerText = t==='red'?'قرمز':'آبی'; $(`q-${idx}`).style.color = c; }
    function actStr(idx, c) { if(c === window[`sta-${idx}`]) { $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; gStroop(idx); } }

    function gTrueFalse(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}">زمین گرد است</div><div style="display:flex;gap:5px;"><button onclick="actTF(${idx},1)">درست</button><button onclick="actTF(${idx},0)">غلط</button></div>`; window[`tfa-${idx}`]=1; }
    function actTF(idx, g) { if(g === window[`tfa-${idx}`]) $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+5; }

    function gRiddle(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text">هرچه از آن برداری بزرگتر می‌شود؟</div><input id="i-${idx}"><button onclick="actRid(${idx})">بررسی</button>`; }
    function actRid(idx) { if($(`i-${idx}`).value === 'چاله') $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+20; }

    function gMemory(idx) { $(`game-${idx}`).innerHTML = `<div class="grid-game" style="grid-template-columns:repeat(4, 1fr);" id="g-${idx}"></div>`; let em=['🍎','🍊','🍋','🍉','🍇','🍓','🍒','🍑']; let d=[...em,...em].sort(()=>Math.random()-0.5); let g=$( `g-${idx}` ); let f=[], l=false; d.forEach((e,i)=>{ let c=document.createElement('div'); c.className='grid-btn'; c.style.color='transparent'; c.innerText=e; c.onclick=()=>{ if(l||c.style.color==='#fff')return; c.style.color='#fff'; f.push({c,e}); if(f.length===2){ l=true; if(f[0].e===f[1].e){ $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; f=[]; l=false; } else { setTimeout(()=>{ f.forEach(x=>x.c.style.color='transparent'); f=[]; l=false; }, 800); } } }; g.appendChild(c); }); }

    function gSimon(idx) { $(`game-${idx}`).innerHTML = `<button onclick="actSim(${idx})">شروع</button><div style="display:flex;gap:5px;margin-top:10px;"><div class="grid-btn" style="background:red;width:30px;" id="s0-${idx}"></div><div class="grid-btn" style="background:blue;width:30px;" id="s1-${idx}"></div></div>`; window[`sm-${idx}`]=[]; window[`smp-${idx}`]=0; }
    function actSim(idx) { window[`sm-${idx}`]=[]; for(let i=0;i<3;i++) window[`sm-${idx}`].push(rand(2)); let i=0; let int=setInterval(()=>{ if(i>=window[`sm-${idx}`].length){clearInterval(int);return;} let e=$(`s${window[`sm-${idx}`][i]}-${idx}`); e.style.opacity=0.2; setTimeout(()=>e.style.opacity=1,300); i++; }, 600); }

    function gPattern(idx) { $(`game-${idx}`).innerHTML = `<div class="grid-game" style="grid-template-columns:repeat(3, 1fr);" id="g-${idx}"></div>`; let g=$(`g-${idx}`); let t=rand(9); for(let i=0;i<9;i++){ let c=document.createElement('div'); c.className='grid-btn'; c.onclick=()=>{ if(i===t) $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; else $(`sc-${idx}`).innerText = Math.max(0, parseInt($(`sc-${idx}`).innerText)-5); }; g.appendChild(c); } }

    function gMemNum(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}" style="font-size:24px;">---</div><button onclick="actMNm(${idx})">نمایش</button><input id="i-${idx}"><button onclick="actMNc(${idx})">بررسی</button>`; }
    function actMNm(idx) { window[`mnn-${idx}`] = rInt(100,999); $(`q-${idx}`).innerText = window[`mnn-${idx}`]; setTimeout(()=>$(`q-${idx}`).innerText='---', 2000); }
    function actMNc(idx) { if(parseInt($(`i-${idx}`).value) === window[`mnn-${idx}`]) $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+15; }

    function gPiano(idx) { $(`game-${idx}`).innerHTML = `<div style="display:flex;gap:5px;"><button onclick="pNote(262)">دو</button><button onclick="pNote(330)">می</button><button onclick="pNote(392)">سل</button></div>`; }
    function pNote(f) { let a = new AudioContext(); let o = a.createOscillator(); o.connect(a.destination); o.frequency.value = f; o.start(); setTimeout(()=>o.stop(), 200); }

    function gMemLetter(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}">---</div><button onclick="actML(${idx})">نمایش</button><input id="i-${idx}"><button onclick="actMLc(${idx})">بررسی</button>`; }
    function actML(idx) { window[`ml-${idx}`] = ['ABC','XYZ','QWE'][rand(3)]; $(`q-${idx}`).innerText = window[`ml-${idx}`]; setTimeout(()=>$(`q-${idx}`).innerText='---', 2000); }
    function actMLc(idx) { if($(`i-${idx}`).value.toUpperCase() === window[`ml-${idx}`]) $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; }

    function gSeqLight(idx) { $(`game-${idx}`).innerHTML = `<div style="display:flex;gap:5px;" id="g-${idx}"></div><button onclick="actSL(${idx})">شروع</button>`; let g=$(`g-${idx}`); for(let i=0;i<4;i++){ let c=document.createElement('div'); c.className='grid-btn'; c.style.width='30px'; c.id=`sl-${idx}-${i}`; g.appendChild(c); } }
    function actSL(idx) { let s=rInt(0,3); let e=$(`sl-${idx}-${s}`); e.style.background='var(--gold)'; setTimeout(()=>e.style.background='var(--bg-inner)', 500); }

    function gWhatChanged(idx) { $(`game-${idx}`).innerHTML = `<div style="font-size:24px;" id="q-${idx}">🍎🍊🍋</div><button onclick="actWC(${idx})">شروع</button>`; }
    function actWC(idx) { $(`q-${idx}`).innerText = ['🍎🍊🍋','🍎🍋🍊','🍊🍎🍋'][rand(3)]; }

    function gImgMem(idx) { $(`game-${idx}`).innerHTML = `<div style="font-size:40px;" id="q-${idx}">❓</div><button onclick="actIM(${idx})">نمایش</button>`; }
    function actIM(idx) { $(`q-${idx}`).innerText = ['🍓','🚀','🐶'][rand(3)]; setTimeout(()=>$(`q-${idx}`).innerText='❓', 1000); }

    function gPuzzle(idx) { $(`game-${idx}`).innerHTML = `<div class="grid-game" style="grid-template-columns:repeat(3, 1fr);" id="g-${idx}"></div>`; let g=$(`g-${idx}`); let a=[1,2,3,4,5,6,7,8,0].sort(()=>Math.random()-0.5); a.forEach((n,i)=>{ let b=document.createElement('div'); b.className='grid-btn'; b.innerText = n||'⬜'; b.onclick=()=>{ if(a[i+1]===0||a[i-1]===0||a[i+3]===0||a[i-3]===0){ let e=a.indexOf(0); [a[i],a[e]]=[a[e],a[i]]; gPuzzle(idx); } }; g.appendChild(b); }); }

    function gScramble(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}"></div><input id="i-${idx}"><button onclick="actScr(${idx})">بررسی</button>`; window[`sw-${idx}`] = ['کتاب','مداد','دریا'][rand(3)]; $(`q-${idx}`).innerText = window[`sw-${idx}`].split('').sort(()=>Math.random()-0.5).join(''); }
    function actScr(idx) { if($(`i-${idx}`).value === window[`sw-${idx}`]) { $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; gScramble(idx); } }

    function gAnagram(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}"></div><input id="i-${idx}"><button onclick="actAna(${idx})">بررسی</button>`; window[`an-${idx}`] = ['ماشین','دانشگاه','تلویزیون'][rand(3)]; $(`q-${idx}`).innerText = window[`an-${idx}`].split('').sort(()=>Math.random()-0.5).join(''); }
    function actAna(idx) { if($(`i-${idx}`).value === window[`an-${idx}`]) { $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+15; gAnagram(idx); } }

    function gTyping(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}"></div><input id="i-${idx}" oninput="if(this.value==='${'سلام'}') { this.value=''; $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+5; }">`; $(`q-${idx}`).innerText = 'سلام'; }

    function gWordGuess(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text">حدس بزن (۵ حرفی)</div><input id="i-${idx}"><button onclick="actWG(${idx})">بررسی</button>`; }
    function actWG(idx) { if($(`i-${idx}`).value === 'کتاب') $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+20; }

    function gWordMaker(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text">ا - ب - ت</div><input id="i-${idx}"><button onclick="actWM(${idx})">بررسی</button>`; }
    function actWM(idx) { let v=$(`i-${idx}`).value; if(v.split('').every(c=>['ا','ب','ت'].includes(c))) $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; }

    function gCapital(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text">پایتخت ایران؟</div><button onclick="actCap(${idx}, 'تهران')">تهران</button><button onclick="actCap(${idx}, 'شیراز')">شیراز</button>`; }
    function actCap(idx, c) { if(c === 'تهران') $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; }

    function gNumWords(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text">سه</div><input id="i-${idx}" type="number"><button onclick="actNW(${idx})">بررسی</button>`; }
    function actNW(idx) { if(parseInt($(`i-${idx}`).value) === 3) $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+10; }

    function gMeaning(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text">شاد</div><button onclick="actM(${idx}, 'خوشحال')">خوشحال</button><button onclick="actM(${idx}, 'غمگین')">غمگین</button>`; }
    function actM(idx, m) { if(m === 'خوشحال') $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+5; }

    function gLetterFind(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text">پیدا کن: ب</div><div class="grid-game" style="grid-template-columns:repeat(3, 1fr);"><div class="grid-btn" onclick="alert('اشتباه')">پ</div><div class="grid-btn" onclick="alert('درست')">ب</div><div class="grid-btn" onclick="alert('اشتباه')">ت</div></div>`; }

    function gAnimalSound(idx) { $(`game-${idx}`).innerHTML = `<button onclick="alert('میو')">🔊</button><div class="result-text">گربه؟</div><button onclick="alert('درست!')">بله</button>`; }

    function gDice(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}" style="font-size:40px;">🎲</div><button onclick="actDice(${idx})">بنداز</button>`; }
    function actDice(idx) { $(`q-${idx}`).innerText = ['⚀','⚁','⚂','⚃','⚄','⚅'][rand(6)]; }

    function gCoin(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}" style="font-size:40px;">🪙</div><button onclick="actCoin(${idx})">بنداز</button>`; }
    function actCoin(idx) { $(`q-${idx}`).innerText = Math.random()<0.5?'🦁':'📖'; }

    function gWheel(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}">❓</div><button onclick="actWhl(${idx})">بچرخون</button>`; }
    function actWhl(idx) { $(`q-${idx}`).innerText = '⏳'; setTimeout(()=>$(`q-${idx}`).innerText = ['۱۰۰','۵۰','۲۰'][rand(3)], 1000); }

    function gRPS(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}">-</div><button onclick="actRPS(${idx}, 'سنگ')">✊</button><button onclick="actRPS(${idx}, 'کاغذ')">✋</button>`; }
    function actRPS(idx, c) { let o=['سنگ','کاغذ'][rand(2)]; $(`q-${idx}`).innerText = c===o?'مساوی':c==='سنگ'?'بردی':'باختی'; }

    function gRPSLS(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text">سنگ/کاغذ/قیچی/مارمولک/اسپاک</div><button onclick="alert('نسخه کامل در فایل‌های دیگر!')">شروع</button>`; }

    function gBlackjack(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}">کارت: 0</div><button onclick="actBJ(${idx})">کارت</button>`; window[`bj-${idx}`]=0; }
    function actBJ(idx) { window[`bj-${idx}`] += rInt(1,10); $(`q-${idx}`).innerText = `کارت: ${window[`bj-${idx}`]}`; if(window[`bj-${idx}`] > 21) { $(`q-${idx}`).innerText = 'باختی!'; window[`bj-${idx}`]=0; } }

    function gMagic8(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}">🔮</div><button onclick="actM8(${idx})">تکان</button>`; }
    function actM8(idx) { $(`q-${idx}`).innerText = ['بله','خیر','شاید'][rand(3)]; }

    function gFortune(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}">☕</div><button onclick="actFrt(${idx})">فال</button>`; }
    function actFrt(idx) { $(`q-${idx}`).innerText = ['خبر خوش','صبر','موفقیت'][rand(3)]; }

    function gSlot(idx) { $(`game-${idx}`).innerHTML = `<div class="result-text" id="q-${idx}">❓ ❓ ❓</div><button onclick="actSlot(${idx})">بچرخون</button>`; }
    function actSlot(idx) { let e=['🍒','🍋','⭐']; let s=[e[rand(3)],e[rand(3)],e[rand(3)]]; $(`q-${idx}`).innerText = s.join(' '); if(s[0]===s[1]&&s[1]===s[2]) $(`sc-${idx}`).innerText = parseInt($(`sc-${idx}`).innerText)+50; }

    function gCelebrate(idx) { $(`game-${idx}`).innerHTML = `<button onclick="alert('🎉 مبارک!')" style="background:var(--gold);color:#000;padding:15px;">🎉 جشن</button>`; }

</script>
</body>
