<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="فال حافظ آنلاین با طراحی سه‌بعدی و قابلیت ذخیره عکس. نیت کنید و بهترین فال حافظ امروز را با لسان‌الغیب بگیرید.">
    
    <!-- فونت‌ها -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- کتابخانه ساخت عکس از HTML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #02040a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden; 
            perspective: 2000px;
            padding-bottom: 30px;
        }

        /* --- کانواس برای ذرات معلق --- */
        #particleCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
        }

        /* --- هدر --- */
        .header { text-align: center; margin-top: 30px; z-index: 10; }
        .header h1 { color: #d4af37; font-size: 34px; text-shadow: 0 0 20px rgba(212, 175, 55, 0.8); margin-bottom: 8px; font-weight: 900; letter-spacing: 2px; }
        .header p { color: #94a3b8; font-size: 15px; transition: opacity 0.5s; }

        /* --- کانتینر کتاب --- */
        .book-container {
            position: relative;
            width: 90vw;
            max-width: 520px;
            height: 600px;
            margin-top: 30px;
            transform-style: preserve-3d;
            transition: transform 1s ease;
            z-index: 10;
        }

        /* --- جلد کتاب (چرمی) --- */
        .book-cover {
            position: absolute;
            inset: 0;
            background: #3e1f1f;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(0,0,0,0.2) 2px, rgba(0,0,0,0.2) 4px);
            border: 6px solid #281111;
            border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transform-origin: right center;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.5s;
            z-index: 20;
            overflow: hidden;
        }
        
        /* طلاکوبی روی جلد */
        .book-cover::before {
            content: ''; position: absolute; inset: 15px; border: 2px solid #d4af37; border-radius: 6px;
            box-shadow: inset 0 0 15px rgba(212, 175, 55, 0.2);
        }
        .book-cover::after {
            content: ''; position: absolute; inset: 25px; border: 1px dashed rgba(212, 175, 55, 0.4); border-radius: 4px;
        }

        .cover-icon { font-size: 100px; margin-bottom: 20px; filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.8)); animation: floatIcon 3s infinite ease-in-out; }
        @keyframes floatIcon { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.05); } }
        
        .cover-title { font-family: 'Noto Nastaliq Urdu', serif; font-size: 48px; color: #d4af37; text-shadow: 0 4px 15px rgba(0,0,0,0.8); margin-bottom: 25px; }
        .cover-hint { color: #d4af37; font-size: 15px; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 30px; border: 1px solid #d4af37; animation: pulseBorder 2s infinite; }
        @keyframes pulseBorder { 0%, 100% { box-shadow: 0 0 0 rgba(212,175,55,0.4); } 50% { box-shadow: 0 0 20px rgba(212,175,55,0.8); } }

        /* باز شدن کتاب */
        .book-container.open .book-cover {
            transform: rotateY(180deg);
            opacity: 0;
            pointer-events: none;
        }

        /* --- صفحات داخلی --- */
        .book-pages {
            position: absolute;
            inset: 0;
            background: #fdfbf7;
            border-radius: 12px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.1), 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateZ(-1px);
            transition: opacity 0.8s 0.6s, visibility 0.8s 0.6s;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #ccc;
        }
        
        .book-container.open .book-pages {
            opacity: 1;
            visibility: visible;
        }

        /* بافت کاغذ */
        .paper-texture {
            position: absolute; inset: 0; pointer-events: none; z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            mix-blend-mode: multiply;
        }

        /* محتوای عکس‌پذیر */
        #captureArea {
            position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; padding: 30px 25px;
            background: transparent;
        }
        
        .bismillah { text-align: center; color: #92400e; font-size: 15px; font-weight: bold; margin-bottom: 20px; font-family: 'Noto Nastaliq Urdu', serif; border-bottom: 2px dashed #d4af37; padding-bottom: 12px; }
        
        .poem-box {
            flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; margin-bottom: 20px;
        }
        
        .poem-text {
            font-family: 'Noto Nastaliq Urdu', serif; font-size: 24px; line-height: 2.4; color: #0f172a; white-space: pre-line; margin-bottom: 25px; animation: fadeInDown 1s;
        }

        .meaning-box {
            background: rgba(212, 175, 55, 0.12); border-right: 4px solid #d4af37; padding: 15px 18px; font-size: 15px; line-height: 1.9; color: #1e293b; border-radius: 8px; text-align: justify; animation: fadeInUp 1s 0.4s backwards;
        }
        .meaning-box strong { color: #92400e; display: block; margin-bottom: 6px; font-size: 16px; }

        .watermark { text-align: center; margin-top: 15px; font-size: 12px; color: #94a3b8; font-weight: bold; }

        /* --- دکمه‌های عملیات --- */
        .action-buttons {
            display: flex; gap: 8px; margin-top: auto; position: relative; z-index: 5;
        }
        .btn {
            flex: 1; padding: 12px 5px; border-radius: 10px; font-family: inherit; font-weight: bold; font-size: 13px; cursor: pointer; border: none; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn-share { background: linear-gradient(135deg, #1e293b, #0f172a); color: #d4af37; border: 1px solid #d4af37; }
        .btn-share:hover { background: #0f172a; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212,175,55,0.3); }
        .btn-image { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; }
        .btn-image:hover { background: #6d28d9; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(139,92,246,0.4); }
        .btn-again { background: #e2e8f0; color: #475569; }
        .btn-again:hover { background: #cbd5e1; }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Toast & Loader */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 12px 24px; border-radius: 50px; font-weight: bold; opacity: 0; visibility: hidden; transition: all 0.3s; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); z-index: 9999;
        }
        .toast.show { opacity: 1; visibility: visible; bottom: 40px; }

        .loader {
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; z-index: 30; border-radius: 12px; opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .loader.active { opacity: 1; visibility: visible; }
        .spinner { width: 60px; height: 60px; border: 4px solid rgba(212, 175, 55, 0.2); border-top-color: #d4af37; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- دکمه‌های پایین صفحه (لینک به مقاله و خانه) --- */
        .bottom-links {
            margin-top: 40px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
            position: relative;
        }
        .link-btn {
            background: rgba(255,255,255,0.1);
            color: #d4af37;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid rgba(212,175,55,0.3);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .link-btn:hover {
            background: rgba(212,175,55,0.2);
            transform: translateY(-2px);
        }
        .link-btn.guide {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: #fff;
            border: none;
            box-shadow: 0 4px 15px rgba(13,71,161,0.4);
        }
        .link-btn.guide:hover {
            box-shadow: 0 6px 20px rgba(13,71,161,0.6);
        }

        @media (max-width: 480px) {
            .book-container { height: 520px; }
            .poem-text { font-size: 20px; }
            .action-buttons { flex-wrap: wrap; }
            .btn { min-width: 45%; }
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="header" id="header">
        <h1>دیوان حافظ</h1>

    <div class="book-container" id="book">

    <script>
        /* ==========================================
           ۱. دیتابیس ۶۰ فال پرتکرار
           ========================================== */
        const hafezDB = [
            { poem: "الا یا ایها الساقی ادر کاسا و ناولها\nکه عشق آسان نمود اول ولی افتاد مشکل‌ها", meaning: "این فال نشان‌دهنده آغاز یک مسیر جدید است. در ابتدا کارها سخت به نظر می‌رسند، اما با پشتکار و توکل بر خدا، به زودی تمام موانع از سر راه شما برداشته خواهد شد. صبر پیشه کنید." },
            { poem: "یوسف گم گشته بازآید به کنعان غم مخور\nکلبه احزان شود روزی گلستان غم مخور", meaning: "فال بسیار مبارکی است. اگر نگران از دست دادن چیزی یا کسی هستید، بدانید که به زودی خبر خوشی به شما می‌رسد. غم‌ها جای خود را به شادی خواهند داد. ناامید نشوید." },
            { poem: "دوش وقت سحر از غصه نجاتم دادند\nواندر آن ظلمت شب آب حیاتم دادند", meaning: "مشکلی که مدت‌ها ذهن شما را درگیر کرده بود، به زودی حل می‌شود. گشایش بزرگی در کار شما رخ خواهد داد. شکرگزار باشید و از فرصت‌های پیش رو نهایت استفاده را ببرید." },
            { poem: "رسید مژده که ایام غم نخواهد ماند\nچنان نماند چنین نیز هم نخواهد ماند", meaning: "این فال به شما می‌گوید که دوران سختی به پایان می‌رسد. هیچ غمی ماندگار نیست. صبور باشید، روزهای خوب در راه است و لبخند به لبان شما بازخواهد گشت." },
            { poem: "دلا بسوز که سوز تو کارها بکند\nنیاز نیم‌شبی دفع صد بلا بکند", meaning: "دعا و راز و نیاز در دل شب، بهترین راه برای حل مشکلات است. اگر به خداوند توکل کنید و از ته دل بخواهید، بلاها از شما دور می‌شوند. به زودی دعایتان مستجاب می‌شود." },
            { poem: "گفتم غم تو دارم گفتا غمت سر آید\nگفتم که ماه من شو گفتا اگر برآید", meaning: "در امور عاطفی و احساسی، خبرهای خوبی در راه است. اگر منتظر پیامی از کسی هستید، به زودی می‌رسد. دل خود را به صبر و امید بسپارید که وصال نزدیک است." },
            { poem: "صلاح کار کجا و من خراب کجا\nببین تفاوت ره از کجاست تا به کجا", meaning: "دوران تغییرات بزرگ نزدیک است. از وضعیت فعلی خود راضی نیستید و به دنبال راهی برای بهتر شدن هستید. با مشورت با افراد عاقل و توکل بر خدا، مسیر درست را پیدا خواهید کرد." },
            { poem: "دوش دیدم که ملائک در میخانه زدند\nگل آدم بسرشتند و به پیمانه زدند", meaning: "این فال نشان‌دهنده برکت و روزی فراوان است. در کارها گشایشی حاصل می‌شود و انرژی مثبتی به زندگی شما وارد می‌شود. زمان خوبی برای شروع کارهای جدید است." },
            { poem: "خوشا شیراز و وضع بی‌مثالش\nخداوندا نگه دار از زوالش", meaning: "سفری در پیش دارید که برای شما خیر و برکت به همراه دارد. اگر قصد سفر دارید، با خیال راحت بروید. همچنین خبری از راه دور به شما می‌رسد که مایه خوشحالی است." },
            { poem: "ما را به رخت نیاز بودست\nای دلبر نامه‌ربای ما", meaning: "دلتنگی‌های شما به پایان می‌رسد. اگر منتظر خبری از کسی هستید، پیامی می‌رسد که قلب شما را آرام می‌کند. در ارتباطات خود بازتر و صمیمی‌تر باشید." },
            { poem: "زلف آشفته و خوی کرده و خندان لب و مست\nپرده‌برداری کاین نکته کجا و من کجا", meaning: "خبر خوشی در زمینه عشق و محبت در راه است. اگر منتظر کسی هستید، به زودی خبری از او می‌رسد. عجله نکنید و بگذارید همه چیز در زمان خودش اتفاق بیفتد." },
            { poem: "به ملازمان سلطان که رساند این دعا را\nکه به شکر پادشاهی ز عنایتت ستادیم", meaning: "در کار اداری یا شغلی، خبر خوبی در راه است. اگر درخواستی دارید، پیگیری کنید که به خیر و صلاح پیش می‌رود و مورد توجه قرار می‌گیرد." },
            { poem: "رواق منظر چشم من آشیانه تست\nکرم نما و فرود آ که خانه خانه تست", meaning: "درهای رحمت به روی شما باز شده است. اگر به دنبال آرامش و حمایت هستید، بدانید که در امان هستید. قلب شما جایگاه عشق و محبت است و به زودی نتیجه خوبی می‌گیرید." },
            { poem: "هر آن که جانب اهل خدا نگه دارد\nخداش در همه حال از بلا نگه دارد", meaning: "نیت خیر شما و پایبندی به اصول، شما را در برابر مشکلات محافظت می‌کند. این فال نوید می‌دهد که در پناه خداوند، از هر گزندی در امان خواهید بود." },
            { poem: "به کوی عشق منه بی‌دلیل راه قدم\nکه رسم و راه طریقت به رهروان گویند", meaning: "برای رسیدن به هدفی که دارید، به راهنمایی و عقل خود تکیه کنید. اگر در مسیر عشق یا کاری، بدون فکر و نقشه راه بروید، ممکن است دچار مشکل شوید. با آگاهی قدم بردارید." },
            { poem: "اگر روم ز پی اش عالمی به هم برسد\nدلم خوش است که در کوی او مقام من است", meaning: "دل شما به جایی یا کسی گره خورده است و برای رسیدن به آن تلاش می‌کنید. این پشتکار شما تحسین‌برانگیز است. بدانید که تلاش‌هایتان بی‌پاسخ نخواهد ماند." },
            { poem: "دیشب به سیل اشک ره خواب می‌زدم\nنقشی به یاد روی تو بر آب می‌زدم", meaning: "احساسات و دلتنگی‌های عمیقی در دل دارید. این فال می‌گوید که این عواطف، هرچند سخت، به زودی آرام می‌گیرند. صبور باشید تا زمان، زخم‌ها را التیام بخشد." },
            { poem: "مرا به رندی و عشق آن فضول می‌بست\nکه از حقیقت و شرع آشنای من کردند", meaning: "شاید دیگران شما را درک نکنند یا مسیرتان را قبول نداشته باشند، اما شما به هدف و حقیقت خود پایبند هستید. به مسیر خود ایمان داشته باشید و به قضاوت دیگران اهمیت ندهید." },

        /* ==========================================
           ۲. سیستم انتخاب فال (بدون تکرار در یک روز)
           ========================================== */
        function getFalData() {
            const today = new Date().toDateString();
            let saved = JSON.parse(localStorage.getItem('hafezFalDailyPro'));
            if (saved && saved.date === today && saved.index < hafezDB.length) {
                return hafezDB[saved.index];
            }
            const newIndex = Math.floor(Math.random() * hafezDB.length);
            localStorage.setItem('hafezFalDailyPro', JSON.stringify({ date: today, index: newIndex }));
            return hafezDB[newIndex];
        }

        function openBook() {
            const book = document.getElementById('book');
            const loader = document.getElementById('loader');
            const sub = document.getElementById('subtitle');

            book.classList.add('open');
            sub.style.opacity = '0'; 

            setTimeout(() => { loader.classList.add('active'); }, 600);

            setTimeout(() => {
                const fal = getFalData();
                document.getElementById('poem-text').innerText = fal.poem;
                document.getElementById('meaning-text').innerText = fal.meaning;
                loader.classList.remove('active');
            }, 1800);
        }

        /* ==========================================
           ۳. قابلیت ساخت عکس برای استوری
           ========================================== */
        function downloadImage() {
            const captureArea = document.getElementById('captureArea');
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ در حال آماده‌سازی...';
            btn.disabled = true;

            html2canvas(captureArea, {
                scale: 2, 
                useCORS: true,
                backgroundColor: '#fdfbf7'
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Fal-Hafez-Rahilanab.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                btn.innerHTML = originalText;
                btn.disabled = false;
                showToast('عکس با موفقیت ذخیره شد!');
            }).catch(err => {
                console.error(err);
                btn.innerHTML = originalText;
                btn.disabled = false;
                showToast('خطا در ساخت عکس!');
            });
        }

        /* ==========================================
           ۴. اشتراک‌گذاری متنی
           ========================================== */
        function shareFal() {
            const poem = document.getElementById('poem-text').innerText;
            const meaning = document.getElementById('meaning-text').innerText;
            const text = `🔮 فال حافظ من:\n\n${poem}\n\n📖 تعبیر: ${meaning}\n\n🌐 فال بگیرید: https://rahilanab.com/fal.html`;

            if (navigator.share) {
                navigator.share({ title: 'فال حافظ', text: text }).catch(console.error);
            } else {
                navigator.clipboard.writeText(text).then(() => { showToast('متن فال کپی شد!'); });
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        /* ==========================================
           ۵. افکت ذرات طلایی متحرک (Particles)
           ========================================== */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) { particles.push(new Particle()); }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
                    </html>
